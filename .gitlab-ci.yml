# GitLab Pages: the demo (component gallery) and the theme builder, built from the sources on every push to main.
pages:
  stage: deploy
  image: node:24.21.0-trixie-slim
  cache:
    key: npm
    paths: [.npm/]
  script:
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline
    - npm run build:site
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
