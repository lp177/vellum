# GitLab Pages: the repository is the site -- no build. demo/ loads the built library committed in dist/ and the theme
# catalog in src/themes/ with relative URLs; the root index.html leads to it. (GitHub Pages serves the same files
# from the root of the branch.)
pages:
  stage: deploy
  image: busybox:1.37
  script:
    - mkdir public
    - cp -r index.html builder.html demo dist src public/
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
